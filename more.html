    <script>
        (function() {
            function initCarousel() {
                var section = document.getElementById('projects');
                if (!section) return;
                var viewport = section.querySelector('.projects-carousel-viewport');
                var track = section.querySelector('.projects-carousel-track');
                if (!viewport || !track) return;
                var translateX = 0, maxScroll = 0, speed = 1.2;
                function updateMaxScroll() { maxScroll = Math.max(0, track.scrollWidth - viewport.offsetWidth); }
                function onWheel(e) {
                    if (!viewport.contains(e.target) && !viewport.isSameNode(e.target)) return;
                    var delta = e.deltaX;
                    if (e.deltaMode === 1) delta *= 40;
                    if (e.deltaMode === 2) delta *= 120;
                    if (delta === 0) return;
                    updateMaxScroll();
                    if (maxScroll <= 0) return;
                    e.preventDefault();
                    e.stopPropagation();
                    translateX -= delta * speed;
                    translateX = Math.min(0, Math.max(-maxScroll, translateX));
                    track.style.transform = 'translateX(' + translateX + 'px)';
                }
                window.addEventListener('resize', updateMaxScroll);
                updateMaxScroll();
                viewport.addEventListener('wheel', onWheel, { passive: false, capture: true });
                track.style.transform = 'translateX(0)';
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initCarousel);
            else initCarousel();
        })();
    </script>
